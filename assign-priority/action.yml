name: Assign priority based on label

inputs:
  PROJECT_ISSUES_TOKEN:
    description: "GH token that has write access to the project board"
    required: true
  project_id:
    description: "Project ID number"
    required: false
    default: "4"

runs:
  using: composite
  steps:
    - name: Set up env variables
      shell: bash
      run: |
        echo "prio1=1 - high" >> $GITHUB_ENV
        echo "prio2=2 - medium" >> $GITHUB_ENV
        echo "prio3=3 - low" >> $GITHUB_ENV
        echo 'custom_field_value=[{{\"name\": \"Priority\",\"type\": \"single_select\",\"value\": \"{0}\"}}]' >> $GITHUB_ENV
    - name: Assign priority 1
      uses: leonsteinhaeuser/project-beta-automations@v2.0.1
      if: github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'priority 1 - high')
      with:
        gh_token: ${{ inputs.PROJECT_ISSUES_TOKEN }}
        organization: owid
        project_id: ${{ inputs.project_id }}
        resource_node_id: ${{ github.event.issue.node_id }}
        operation_mode: custom_field
        custom_field_values: ${{ format(env.custom_field_value, env.prio1) }}
    - name: Assign priority 2
      uses: leonsteinhaeuser/project-beta-automations@v2.0.1
      if: github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'priority 2 - medium')
      with:
        gh_token: ${{ inputs.PROJECT_ISSUES_TOKEN }}
        organization: owid
        project_id: ${{ inputs.project_id }}
        resource_node_id: ${{ github.event.issue.node_id }}
        operation_mode: custom_field
        custom_field_values: ${{ format(env.custom_field_value, env.prio2) }}
    - name: Assign priority 3
      uses: leonsteinhaeuser/project-beta-automations@v2.0.1
      if: github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'priority 3 - low')
      with:
        gh_token: ${{ inputs.PROJECT_ISSUES_TOKEN }}
        organization: owid
        project_id: ${{ inputs.project_id }}
        resource_node_id: ${{ github.event.issue.node_id }}
        operation_mode: custom_field
        custom_field_values: ${{ format(env.custom_field_value, env.prio3) }}
    - name: Assign priority none
      uses: leonsteinhaeuser/project-beta-automations@v2.0.1
      if: github.event_name == 'issues' && !contains(github.event.issue.labels.*.name, 'priority 1 - high') && !contains(github.event.issue.labels.*.name, 'priority 2 - medium') && !contains(github.event.issue.labels.*.name, 'priority 3 - low')
      with:
        gh_token: ${{ inputs.PROJECT_ISSUES_TOKEN }}
        organization: owid
        project_id: ${{ inputs.project_id }}
        resource_node_id: ${{ github.event.issue.node_id }}
        operation_mode: custom_field
        custom_field_values: ${{ format(env.custom_field_value, '') }}
