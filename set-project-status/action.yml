name: Assign project status automatically

inputs:
  PROJECT_ISSUES_TOKEN:
    description: "GH token that has write access to the project board"
    required: true
  PROJECT_ID:
    description: "Project ID number"
    required: false
    default: "4"
  STATUS_TODO:
    description: "Status name for todo items"
    required: false
    default: "Todo"
  STATUS_DONE:
    description: "Status name for done items"
    required: false
    default: "Done"
  STATUS_IN_PROGRESS:
    description: "Status name for in progress items"
    required: false
    default: "In Progress"
  STATUS_BLOCKED:
    description: "Status name for blocked items"
    required: false
    default: "Blocked"

runs:
  using: composite
  steps:
    # Issues
    - name: Move issue to ${{ inputs.STATUS_TODO }}
      if: github.event_name == 'issues' && (github.event.action == 'opened' || github.event.action == 'reopened')
      uses: leonsteinhaeuser/project-beta-automations@v2.1.0
      with:
        gh_token: ${{ inputs.PROJECT_ISSUES_TOKEN }}
        organization: owid
        project_id: ${{ inputs.PROJECT_ID }}
        resource_node_id: ${{ github.event.issue.node_id }}
        status_value: ${{ inputs.STATUS_TODO }} # Target status
    - name: Move issue to ${{ inputs.STATUS_DONE }}
      if: github.event_name == 'issues' && github.event.action == 'closed'
      uses: leonsteinhaeuser/project-beta-automations@v2.1.0
      with:
        gh_token: ${{ inputs.PROJECT_ISSUES_TOKEN }}
        organization: owid
        project_id: ${{ inputs.PROJECT_ID }}
        resource_node_id: ${{ github.event.issue.node_id }}
        status_value: ${{ inputs.STATUS_DONE }} # Target status

    # PRs
    - name: Move PR to ${{ inputs.STATUS_IN_PROGRESS }} and current cycle
      if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'reopened')
      uses: leonsteinhaeuser/project-beta-automations@v2.1.0
      with:
        gh_token: ${{ inputs.PROJECT_ISSUES_TOKEN }}
        organization: owid
        project_id: ${{ inputs.PROJECT_ID }}
        resource_node_id: ${{ github.event.pull_request.node_id }}
        status_value: ${{ inputs.STATUS_IN_PROGRESS }} # Target status
        custom_field_values: '[{\"name\": \"Cycle\",\"type\": \"iteration\",\"value\": \"@current\"}]'
    - name: Move PR to ${{ inputs.STATUS_BLOCKED }} and current cycle
      if: github.event_name == 'pull_request' && github.event.action == 'review_requested'
      uses: leonsteinhaeuser/project-beta-automations@v2.1.0
      with:
        gh_token: ${{ inputs.PROJECT_ISSUES_TOKEN }}
        organization: owid
        project_id: ${{ inputs.PROJECT_ID }}
        resource_node_id: ${{ github.event.pull_request.node_id }}
        status_value: ${{ inputs.STATUS_BLOCKED }} # Target status
        custom_field_values: '[{\"name\": \"Cycle\",\"type\": \"iteration\",\"value\": \"@current\"}]'
    - name: Move PR to ${{ inputs.STATUS_DONE }}
      if: github.event_name == 'pull_request' && github.event.action == 'closed'
      uses: leonsteinhaeuser/project-beta-automations@v2.1.0
      with:
        gh_token: ${{ inputs.PROJECT_ISSUES_TOKEN }}
        organization: owid
        project_id: ${{ inputs.PROJECT_ID }}
        resource_node_id: ${{ github.event.pull_request.node_id }}
        status_value: ${{ inputs.STATUS_DONE }} # Target status
